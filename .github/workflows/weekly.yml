name: Weekly dictionary build

on:
  schedule:
    # Every Saturday 04:17 Beijing time (Friday 20:17 UTC).
    # Off-peak minute so GitHub's scheduler does not drop the run.
    - cron: "17 20 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-dictionary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The wiki throttles requests from datacenter IPs: a full fetch takes about
    # 50 minutes here, against roughly 90 seconds from a home connection. Keep
    # a wide margin so a slow run does not get killed.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libime-bin

      - name: Install Python dependencies
        run: pip install opencc pypinyin pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build the dictionary
        run: make build

      - name: Collect build info
        run: |
          test -s minecraft-cn.dict
          ENTRIES=$(wc -l < mc-cn.raw)
          ls -l minecraft-cn.dict mc-cn.raw
          echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "ENTRIES=${ENTRIES}" >> "$GITHUB_ENV"
          # A half-finished fetch still produces a small but valid dictionary,
          # so guard the entry count rather than trusting the build to fail.
          if [ "$ENTRIES" -lt 5000 ]; then
            echo "Only ${ENTRIES} entries, expected at least 5000." >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-cn-dict-${{ env.DATE }}
          path: minecraft-cn.dict
          retention-days: 30

      # Reuse the "nightly" tag instead of minting a new release per run, so
      # the download URL stays fixed. Force-pushing moves the tag to this
      # commit every time.
      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin refs/tags/nightly

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Rebuilt from Minecraft Wiki (zh.minecraft.wiki) on ${DATE} (UTC)." \
            "" \
            "- minecraft-cn.dict: ${ENTRIES} entries, for fcitx5-pinyin" \
            "- Built from commit ${{ github.sha }}" \
            "" \
            "This release is replaced on every scheduled run, so its download URL is stable." \
            > release-notes.md

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly minecraft-cn.dict --clobber
            gh release edit nightly --notes-file release-notes.md
          else
            # create has to carry the asset: uploading afterwards only happens
            # on the branch above, so passing no file would publish an empty
            # release.
            gh release create nightly \
              --title "Nightly build" \
              --notes-file release-notes.md \
              --latest \
              minecraft-cn.dict
          fi

          # Fail loudly instead of publishing a release nobody can download.
          gh release view nightly --json assets --jq '.assets[].name' | grep -qx minecraft-cn.dict
